<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- The menu backdrop: the lines of a great globe rising behind the three age groups. -->
  <defs>
    <clipPath id="earth"><circle cx="700" cy="1180" r="900"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#2c3d58" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2c3d58" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <circle cx="700" cy="1180" r="900" fill="none" stroke="#f3ead8" stroke-opacity=".16" stroke-width="1.5"/>
  <g clip-path="url(#earth)" fill="none" stroke="#f3ead8" stroke-opacity=".08" stroke-width="1.2">
    <!-- Meridians -->
    <ellipse cx="700" cy="1180" rx="160" ry="900"/>
    <ellipse cx="700" cy="1180" rx="330" ry="900"/>
    <ellipse cx="700" cy="1180" rx="510" ry="900"/>
    <ellipse cx="700" cy="1180" rx="700" ry="900"/>
    <line x1="700" y1="280" x2="700" y2="900"/>
    <!-- Parallels -->
    <ellipse cx="700" cy="380" rx="420" ry="40"/>
    <ellipse cx="700" cy="500" rx="590" ry="58"/>
    <ellipse cx="700" cy="630" rx="720" ry="76"/>
    <ellipse cx="700" cy="770" rx="820" ry="92"/>
  </g>
  <!-- A few stars above the horizon of the globe -->
  <g fill="#f3ead8" opacity=".35">
    <circle cx="140" cy="90" r="1.4"/><circle cx="260" cy="200" r="1"/><circle cx="1180" cy="120" r="1.4"/>
    <circle cx="1290" cy="260" r="1"/><circle cx="980" cy="60" r="1"/><circle cx="420" cy="50" r="1"/>
    <circle cx="80" cy="330" r="1"/><circle cx="1340" cy="420" r="1.2"/>
  </g>
</svg>
